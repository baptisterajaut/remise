name: Release

# A `v*` tag builds every platform and attaches the installers to a draft GitHub release.
# A manual run builds the same and keeps them as workflow artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, vendor: windows-x64, target: "" }
          - { name: macOS Apple Silicon, os: macos-latest, vendor: macos-arm64, target: aarch64-apple-darwin }
          - { name: macOS Intel, os: macos-latest, vendor: macos-x64, target: x86_64-apple-darwin }
          - { name: Linux x64 AppImage, os: ubuntu-22.04, vendor: linux-x64, target: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # After setup-python: macOS runners don't guarantee a `python`.
      - name: Tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          app=$(python -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          [ "v$app" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} but app version $app"; exit 1; }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.vendor }}
      - run: pnpm install --frozen-lockfile
      - name: Fetch bundled tools (pinned + checksummed)
        run: python scripts/vendor.py ${{ matrix.vendor }}
      # CBA: unsigned builds. Signing/notarization needs an Apple Developer ID and a Windows
      # certificate; tauri-action picks them up from APPLE_* / TAURI_SIGNING_* secrets once set.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Remise ${{ github.ref_name }}
          releaseBody: Local file tools. Pick the installer for your system; bundled third-party tools are listed in THIRD_PARTY.md inside the app.
          releaseDraft: true
          uploadWorkflowArtifacts: true
          # Windows also ships remise-cli.exe, the console front of the command line (installed as bin\remise.exe).
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }} --config src-tauri/tauri.vendor.conf.json ${{ runner.os == 'Windows' && '--features cli-wrapper' || '' }}
      # The command line as installed, end to end: `remise` found on the PATH (/PATH) as
      # bin\remise.exe, in front of the release Remise.exe (a GUI program: this is what the wrapper
      # is for), bundled tools found through the installed resources, then the uninstaller taking
      # bin\ and the PATH entry away.
      - name: Command line from the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)[0].FullName
          Start-Process $setup -ArgumentList '/S', '/PATH' -Wait
          $root = Join-Path $env:LOCALAPPDATA 'Remise'
          $dir = Join-Path $root 'bin'
          $onPath = { ((Get-ItemProperty HKCU:\Environment).Path -split ';') -contains $dir }
          if (-not (& $onPath)) { throw "$dir is not on the user PATH" }
          # What a new terminal sees: the user PATH first, so `remise` is bin\remise.exe.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + $env:Path
          $cli = (Get-Command remise).Source
          if ($cli -ne (Join-Path $dir 'remise.exe')) { throw "remise resolves to $cli" }
          if (-not ((remise list) -match '^  pdf-compress ')) { throw 'remise list printed no pdf-compress' }
          Push-Location (New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'cli'))
          $qr = remise create-qr --text hello --format png
          $jpg = remise img-convert --format jpg $qr
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $jpg)) { throw "img-convert gave: $jpg" }
          "$qr -> $jpg"
          # A usage error exits 2, read without 'Stop' (and native commands under it) ending the script.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          remise nope 2> nope.txt
          $code = $LASTEXITCODE
          # Or the runner's epilogue (`exit $LASTEXITCODE`) fails the step on it after all passed.
          $global:LASTEXITCODE = 0
          $ErrorActionPreference = 'Stop'
          if ($code -ne 2) { throw "a usage error exited with ${code}: $(Get-Content nope.txt)" }
          Pop-Location
          # _?= runs the uninstaller in place, so -Wait waits for it.
          Start-Process (Join-Path $root 'uninstall.exe') -ArgumentList '/S', "_?=$root" -Wait
          if (& $onPath) { throw "$dir is still on the user PATH" }
          if (Test-Path $dir) { throw "$dir is still there" }
      - name: Command line from the AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          # No FUSE needed: the runtime unpacks to a temp dir and runs from there.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          app=$(echo "$PWD"/src-tauri/target/release/bundle/appimage/*.AppImage)
          cd "$(mktemp -d)"
          "$app" list | grep -q '^  pdf-compress '
          qr=$("$app" create-qr --text hello --format png)
          # In this folder, not inside the app (its AppRun changes folder), and a relative input
          # found from here.
          [ "$qr" = "$PWD/remise.qr.png" ] || { echo "wrote $qr instead of $PWD/remise.qr.png"; exit 1; }
          jpg=$("$app" img-convert --format jpg remise.qr.png)
          echo "$qr -> $jpg"
          test -s "$jpg"
      # Tauri writes zlib disk images; lzma (ULMO, macOS 10.15+, and Remise needs 11) makes them
      # ~40 MB smaller. Converted after the fact, then put in place of the uploaded one.
      - name: Recompress the disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          for dmg in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            hdiutil convert "$dmg" -format ULMO -o "$dmg.lzma.dmg"
            mv "$dmg.lzma.dmg" "$dmg"
            # It still mounts and holds the app.
            mnt=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
            ls "$mnt"/*.app/Contents/MacOS/
            # The command line from the shipped app, its tools found inside the .app. The Intel
            # build runs on this arm64 runner only through Rosetta.
            if [ "${{ matrix.target }}" = aarch64-apple-darwin ] || arch -x86_64 /usr/bin/true 2>/dev/null; then
              app=$(echo "$mnt"/*.app)/Contents/MacOS/remise
              work=$(mktemp -d)
              "$app" list | grep -q '^  pdf-compress '
              qr=$(cd "$work" && "$app" create-qr --text hello --format png)
              jpg=$("$app" img-convert --format jpg "$qr")
              echo "$qr -> $jpg"
              test -s "$jpg"
            else
              echo "no Rosetta here: the Intel command line isn't run"
            fi
            hdiutil detach "$mnt"
            ls -l "$dmg"
            if [ -n "$TAG" ]; then gh release upload "$TAG" "$dmg" --clobber; fi
          done
      - name: Keep the recompressed disk image (manual runs)
        if: runner.os == 'macOS' && github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg-lzma-${{ matrix.vendor }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
