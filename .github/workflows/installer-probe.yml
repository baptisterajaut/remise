name: Installer probe

# Throwaway: replays the release's "Command line from the installer" step, traced, on the
# installer a release run kept. Deleted once that step is understood.
on:
  workflow_dispatch:
    inputs:
      run:
        description: Release run id whose windows-x64-nsis artifact to test
        required: true

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-nsis
          path: nsis
          run-id: ${{ inputs.run }}
          github-token: ${{ github.token }}
      - name: Replay, traced
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "pwsh $($PSVersionTable.PSVersion)"
          Get-ChildItem -Recurse nsis | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300
          $setup = (Get-ChildItem -Recurse nsis -Filter *-setup.exe)[0].FullName
          Start-Process $setup -ArgumentList '/S', '/PATH' -Wait
          $root = Join-Path $env:LOCALAPPDATA 'Remise'
          $dir = Join-Path $root 'bin'
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + $env:Path
          Push-Location (New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'cli'))
          $qr = remise create-qr --text hello --format png
          "A create-qr LASTEXITCODE=$LASTEXITCODE qr=$qr"
          $jpg = remise img-convert --format jpg $qr
          "B img-convert LASTEXITCODE=$LASTEXITCODE jpg=$jpg"
          Set-PSDebug -Trace 1
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          remise nope 2> nope.txt
          $code = $LASTEXITCODE
          Set-PSDebug -Off
          "C nope code=$code"
          "C stderr: $(Get-Content nope.txt -Raw)"
          $ErrorActionPreference = 'Stop'
          Pop-Location
          "D before uninstall"
          Start-Process (Join-Path $root 'uninstall.exe') -ArgumentList '/S', "_?=$root" -Wait
          "E after uninstall LASTEXITCODE=$LASTEXITCODE"
          "F on PATH: $(((Get-ItemProperty HKCU:\Environment).Path -split ';') -contains $dir)"
          "G bin exists: $(Test-Path $dir)"
          "H end of script"
