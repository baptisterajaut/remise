name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # The UI test only needs a Chromium; the Linux runner ships Google Chrome.
      - name: UI walkthrough
        if: runner.os == 'Linux'
        run: pnpm test:ui

  # Every tool against real binaries: the bundled ones (vendor/) plus, where upstream has no
  # relocatable build, the system packages a user would install.
  smoke:
    name: Smoke (${{ matrix.vendor }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, vendor: windows-x64 }
          - { os: ubuntu-24.04, vendor: linux-x64 }
          - { os: macos-latest, vendor: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux deps (webview to compile, IM6/gs/tesseract from the distro)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            ghostscript tesseract-ocr imagemagick
          # Ubuntu's ImageMagick 6 policy forbids writing PDF; the fixtures need it.
          sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml
          # Chrome's sandbox needs unprivileged user namespaces, which 24.04's AppArmor blocks.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: macOS deps without a relocatable upstream build
        if: runner.os == 'macOS'
        run: brew install ghostscript tesseract imagemagick potrace
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
      - run: python scripts/vendor.py ${{ matrix.vendor }}
      - run: cargo test --manifest-path src-tauri/Cargo.toml -- --ignored smoke --nocapture
        env:
          REMISE_VENDOR: ${{ github.workspace }}/vendor
