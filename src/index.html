<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remise</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <h1>remise</h1>
        <p class="tag">local file tools &mdash; <span id="tool-count">0</span> on the wall, <b>0 bytes uploaded</b></p>
      </div>
      <div class="top-right">
        <label class="search">
          <span class="sr">Search tools</span>
          <input id="search" type="search" placeholder="find a tool…  ( / )" autocomplete="off" spellcheck="false" />
        </label>
        <button type="button" class="gear" id="gear" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
          </svg>
        </button>
      </div>
    </header>

    <nav class="rail" id="rail" aria-label="Families"></nav>

    <main id="main">
      <section id="wall" class="wall" aria-label="Tools"></section>

      <section id="bench" class="bench" hidden aria-label="Bench">
        <button class="back" id="back" type="button">&larr; back to the wall</button>
        <div class="bench-grid">
          <div class="card spec">
            <p class="eyebrow" id="bench-family"></p>
            <h2 id="bench-title" tabindex="-1"></h2>
            <p class="blurb" id="bench-blurb"></p>
            <form id="params" class="params" onsubmit="return false"></form>
            <div id="chain-steps" class="chain-steps" hidden></div>
          </div>
          <div class="card queue">
            <div class="drop" id="drop">
              <p><b>Drop files here</b> or <button type="button" class="link" id="browse">browse</button></p>
              <p class="accepts" id="accepts"></p>
            </div>
            <ol id="files" class="files"></ol>
            <p id="bench-note" class="bench-note" hidden></p>
            <div class="actions">
              <button type="button" class="ghost" id="clear">Clear</button>
              <button type="button" class="go" id="run">Run</button>
            </div>
          </div>
        </div>
      </section>

      <section id="chains" class="chains" hidden>
        <div class="card builder">
          <p class="eyebrow">New chain</p>
          <h2>Tools in a row</h2>
          <p class="blurb">Each step's output feeds the next. Only the last result lands next to your file.</p>
          <input id="chain-name" class="chain-name" placeholder="Name it — e.g. Scan to archive" />
          <ol id="chain-draft" class="chain-draft"></ol>
          <div class="add-step">
            <select id="chain-add" aria-label="Add a step"></select>
            <button type="button" class="ghost" id="chain-add-btn">Add step</button>
          </div>
          <button type="button" class="go" id="chain-save">Save chain</button>
        </div>
        <div id="chain-list" class="chain-list"></div>
      </section>

      <section id="settings" class="settings" hidden aria-label="Settings">
        <button class="back" id="settings-back" type="button">&larr; back to the wall</button>
        <div class="card sheet">
          <p class="eyebrow">Settings</p>
          <div class="tabs" role="tablist" id="settings-tabs"></div>
          <div id="settings-panel" class="panel" role="tabpanel"></div>
        </div>
      </section>
    </main>

    <div id="dropveil" class="dropveil" hidden><p>Drop to see what fits</p></div>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
